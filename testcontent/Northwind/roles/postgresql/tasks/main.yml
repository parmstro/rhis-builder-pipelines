---

- name: "Install PostgreSQL packages"
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql
      - python3-psycopg2
    state: present

- name: "Check if PostgreSQL is initialized"
  ansible.builtin.stat:
    path: "/var/lib/pgsql/data/PG_VERSION"
  register: pg_data

- name: "Initialize PostgreSQL database"
  ansible.builtin.command: postgresql-setup --initdb
  when: not pg_data.stat.exists
  changed_when: true

- name: "Deploy pg_hba.conf"
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/pgsql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: restart postgresql

- name: "Deploy postgresql.conf"
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: /var/lib/pgsql/data/postgresql.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: restart postgresql

- name: "Enable and start PostgreSQL"
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: "Open firewall for PostgreSQL"
  ansible.posix.firewalld:
    port: "{{ postgresql_port }}/tcp"
    state: enabled
    immediate: true
    permanent: true

- name: "Create application database user"
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_app_user }}"
    password: "{{ postgresql_app_password }}"
    state: present

- name: "Create Northwind database"
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db_name }}"
    owner: "{{ postgresql_app_user }}"
    state: present

- name: "Load Northwind schema"
  become_user: postgres
  community.postgresql.postgresql_script:
    db: "{{ postgresql_db_name }}"
    path: "{{ role_path }}/files/sql/schema.sql"
  register: schema_load
  changed_when: schema_load.changed

- name: "Load Northwind seed data"
  become_user: postgres
  community.postgresql.postgresql_script:
    db: "{{ postgresql_db_name }}"
    path: "{{ role_path }}/files/sql/seed_data.sql"
  register: seed_load
  changed_when: seed_load.changed

- name: "Grant privileges to application user"
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: "{{ postgresql_db_name }}"
    role: "{{ postgresql_app_user }}"
    objs: ALL_IN_SCHEMA
    privs: SELECT,INSERT,UPDATE,DELETE
    type: table
...
