---
# Northwind Qualification Test
# Data-driven: test cases defined in testdata/qa/
# Exercises full order lifecycle and data integrity validation.

- name: "Northwind Qualification Test"
  hosts: nw_lbservers
  gather_facts: true

  vars:
    base_url: "http://{{ ansible_fqdn }}:{{ haproxy_frontend_port }}"
    testdata_dir: "{{ playbook_dir }}/testdata/qa"

  tasks:

    - name: "Wait for application to be ready"
      ansible.builtin.uri:
        url: "{{ base_url }}/northwind/api/health/"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10

    - name: "Run data integrity tests"
      ansible.builtin.include_tasks: tasks/run_test_cases.yml
      vars:
        test_suite_file: "{{ testdata_dir }}/data_integrity.yml"

    - name: "Run order lifecycle tests"
      ansible.builtin.include_tasks: tasks/run_test_cases.yml
      vars:
        test_suite_file: "{{ testdata_dir }}/order_lifecycle.yml"

    - name: "Qualification test complete"
      ansible.builtin.debug:
        msg: "All qualification tests passed - full order lifecycle verified"
...
