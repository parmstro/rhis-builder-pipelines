---
- name: "Set the wp_config"
  ansible.builtin.set_fact:
    wp_base_path: "/srv/wordpress"

- name: "Set the wp_config"
  ansible.builtin.set_fact:
    wp_config_path: "{{ wp_base_path }}/wp-config.php"

- name: "Add group 'wordpress'"
  ansible.builtin.group:
    name: "wordpress"

- name: "Add user 'wordpress'"
  ansible.builtin.user:
    name: "wordpress"
    group: "wordpress"
    home: "{{ wp_base_path }}"

- name: Check if wp-config.php already contains salts
  ansible.builtin.command:
    cmd: "grep -q 'AUTH_KEY' {{ wp_config_path }}"
  register: wp_salts_exist
  failed_when: false
  changed_when: false
      
- name: Fetch WordPress salts from API
  ansible.builtin.uri:
    url: https://api.wordpress.org/secret-key/1.1/salt/
    return_content: true
  register: wp_salts
  when: wp_salts_exist.rc != 0
  delegate_to: localhost

- name: "Ensure that MariaDB Service is enabled and running"
  ansible.builtin.service:
    name: "mariadb"
    state: "started"
    enabled: true

- name: "Create WordPress database"
  community.mysql.mysql_db:
    name: "{{ wp_db_name }}"
    check_implicit_admin: true
    login_user: "root"
    login_unix_socket: "/var/lib/mysql/mysql.sock"
    config_file: "/etc/my.cnf.d/mariadb-server.cnf"
    state: present

- name: "Create WordPress database user"
  community.mysql.mysql_user:
    name: "{{ wp_db_user }}"
    password: "{{ wp_db_password }}"
    check_implicit_admin: true
    login_user: "root"
    login_unix_socket: "/var/lib/mysql/mysql.sock"
    config_file: "/etc/my.cnf.d/mariadb-server.cnf"
    priv: "{{ wp_db_name }}.*:ALL"
    state: present

- name: "Ensure that MariaDB Service is restarted"
  ansible.builtin.service:
    name: "mariadb"
    state: "restarted"
    enabled: true

- name: "Copy WordPress config file"
  ansible.builtin.template:
    src: "wp-config.php"
    dest: "{{ wp_config_path }}"
    mode: "0640"

- name: Change ownership of WordPress installation
  ansible.builtin.file:
    path: "{{ wp_base_path }}"
    owner: "wordpress"
    group: "wordpress"
    state: directory
    recurse: true

- name: "Set the SELinux policy for the Wordpress"
  community.general.sefcontext:
    setype: "httpd_sys_content_t"
    target: "{{ wp_base_path }}(/.*)?"
    state: "present"

- name: "Set the SELinux policy for WordPress configuration"
  community.general.sefcontext:
    setype: "httpd_sys_script_exec_t"
    target: "{{ wp_config_path }}"
    state: "present"

- name: "Set the SELinux policy for WordPress content"
  community.general.sefcontext:
    setype: "httpd_sys_rw_content_t"
    target: "{{ wp_base_path }}/wp-content(/.*)?"
    state: "present"

- name: "Set the SELinux policy for the Php files"
  community.general.sefcontext:
    setype: "httpd_sys_script_exec_t"
    target: "{{ wp_base_path }}/*.php"
    state: "present"

- name: "Set the SELinux policy for upgrade content"
  community.general.sefcontext:
    setype: "httpd_sys_rw_content_t"
    target: "{{ wp_base_path }}/wp-content/upgrade(/.*)?"
    state: "present"

- name: "Set the SELinux policy for the uploads content"
  community.general.sefcontext:
    setype: "httpd_sys_rw_content_t"
    target: "{{ wp_base_path }}/wp-content/uploads(/.*)?"
    state: "present"

- name: "Set the SELinux policy for includes"
  community.general.sefcontext:
    setype: "httpd_sys_script_exec_t"
    target: "{{ wp_base_path }}/wp-includes/*.php"
    state: "present"

- name: "Active the SELinux policy"  # noqa: command-instead-of-module
  ansible.builtin.command: "restorecon -Rv {{ wp_base_path }}"
  register: restorecon_result
  changed_when: restorecon_result.rc == 0

- name: "Ensure php-fpm is enabled and started"
  ansible.builtin.service:
    name: "php-fpm"
    state: "restarted"
    enabled: true
